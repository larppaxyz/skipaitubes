<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Skip AI Tunes</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Skip AI Tunes</h1>
  <label><input id="enabled" type="checkbox" disabled> Skip AI-tagged videos</label>
  <p>Advances past AI-tagged videos to the next playlist item or a suggested video.</p>
  <label><input id="blockAllAI" type="checkbox" disabled> Block all AI-tagged videos</label>
  <p>Hides tagged videos on Home and in search results, and automatically advances past them during playback. Off by default.</p>
  <p>The AI badge may refer to visuals as well as music.</p>
  <span id="status" role="status"></span>
  <script src="popup.js"></script>
</body>
</html>
